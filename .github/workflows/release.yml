name: Release
# A tag v<version> makes the packages (one for each platform with a Java runtime, one without), a GitHub release with
# them, and publishes them to the Visual Studio Marketplace (secret VSCE_PAT) and to Open VSX (secret OVSX_PAT).
# An odd minor version (v1.5.x) is a pre-release: the packages are marked by scripts/package-platforms.js.
# The release also has the archives of the Requality MCP server (requality-mcp-*, scripts/package-mcp.js), with build
# provenance attestations of this workflow for the tag (only a tag makes them):
#   gh attestation verify <archive> -R formalized-si/requality-vscode --source-ref refs/tags/v<version> \
#     --signer-workflow formalized-si/requality-vscode/.github/workflows/release.yml
#
# The build job runs the build tools (npm install scripts, Gradle) with read access only and no stored credentials. The
# publish job writes the GitHub release and attestations. Independent store jobs have read-only GitHub access and
# publish the exact release assets. A manual run retries an existing release without rebuilding or recreating it.
# The actions are pinned by commit.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing GitHub release tag to publish (no rebuild)'
        type: string
        required: true
      registry:
        description: 'Registry to retry'
        type: choice
        options: [both, marketplace, open-vsx]
        default: both
        required: true
permissions:
  contents: read
jobs:
  build:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run package:platforms
      - run: node scripts/package-mcp.js --no-build
      # the archive of this machine with its own Java runtime, before anything is published
      - name: Smoke test of the MCP archive
        run: |
          mkdir -p "$RUNNER_TEMP/mcp"
          tar -xzf release/requality-mcp-*-linux-x64.tar.gz -C "$RUNNER_TEMP/mcp"
          # the launcher takes jre/ of the archive before JAVA_HOME
          node test/mcp/smoke.js "$(ls -d "$RUNNER_TEMP"/mcp/requality-mcp-*)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: requality-vscode-packages
          path: |
            release/*.vsix
            release/requality-mcp-*
          if-no-files-found: error
  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: requality-vscode-packages
          path: release
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: release/requality-mcp-*
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          path: source
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
      - name: GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          minor=$(echo "${GITHUB_REF_NAME#v}" | cut -d. -f2)
          pre=$([ $((minor % 2)) -eq 1 ] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" release/*.vsix release/requality-mcp-* --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" --notes-file source/CHANGELOG.md $pre
  stores:
    name: Publish (${{ matrix.registry }})
    needs: publish
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        registry: ${{ github.event_name == 'workflow_dispatch' && inputs.registry != 'both' && fromJSON(format('["{0}"]', inputs.registry)) || fromJSON('["marketplace", "open-vsx"]') }}
    concurrency:
      group: stores-${{ matrix.registry }}-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Require publishing credential
        env:
          PUBLISH_TOKEN: ${{ secrets[format('{0}_PAT', matrix.registry == 'marketplace' && 'VSCE' || 'OVSX')] }}
          SECRET_NAME: ${{ matrix.registry == 'marketplace' && 'VSCE_PAT' || 'OVSX_PAT' }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::Missing $SECRET_NAME. Store publication has not happened. Add the secret and retry this existing release."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: scripts/verify-release-vsix.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Download and verify the existing release VSIX
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected an existing release tag v<major>.<minor>.<patch>"
            exit 1
          fi
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --json tagName,isDraft,isPrerelease,assets > "$RUNNER_TEMP/release.json"
          python3 scripts/verify-release-vsix.py "$RUNNER_TEMP/release.json" "$RELEASE_TAG"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --dir release
          python3 scripts/verify-release-vsix.py "$RUNNER_TEMP/release.json" "$RELEASE_TAG" release
      # No dependency of the extension or build script runs in these jobs. The PAT is exposed only to publishing.
      - name: Install the pinned publishing tool without install scripts
        env:
          PUBLISH_TOOL: ${{ matrix.registry == 'marketplace' && '@vscode/vsce@4.0.0' || 'ovsx@1.3.0' }}
        run: npm install --prefix "$RUNNER_TEMP/publisher" --ignore-scripts --no-package-lock --no-audit --no-fund "$PUBLISH_TOOL"
      - name: Visual Studio Marketplace
        if: matrix.registry == 'marketplace'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: '"$RUNNER_TEMP/publisher/node_modules/.bin/vsce" publish --packagePath release/*.vsix --skip-duplicate'
      - name: Open VSX
        if: matrix.registry == 'open-vsx'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          for f in release/*.vsix; do
            "$RUNNER_TEMP/publisher/node_modules/.bin/ovsx" publish "$f" --skip-duplicate
          done
