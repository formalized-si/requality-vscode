plugins {
    id 'java'
}

group = 'com.unitesk.requality.vscode'
version = '1.5.0'

repositories {
    mavenCentral()
    // Repositories used by the upstream Requality build (webvector 3.5 is published only there).
    maven { url 'https://nxs.ispras.ru/repository/public-maven-releases/' }
    maven { url 'https://nxs.ispras.ru/repository/public-releases/' }
}

sourceSets {
    main {
        java { srcDirs = ['upstream/core/java', 'src/main/java'] }
        // The core's own resources (upstream "resources": the localization bundles of the core messages are read from
        // the class path as localization.localization_en / _ru).
        resources { srcDirs = ['src/main/resources', 'upstream/resources'] }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
    options.compilerArgs += ['-nowarn', '-Xlint:none']
}

dependencies {
    // Upstream unstable core dependencies (build.gradle "extraLib"), same versions, except:
    // - Tika 3.3.3 with POI 5.5.1: Tika 2.7.0 parsed the XFA forms of a PDF with external entities (CVE-2025-54988,
    //   CVE-2025-66516);
    // - FreeMarker 2.3.34 and Jetty 9.4.58 (the last 9.4 versions: fixes of CVE-2023-26048, CVE-2023-26049 and others);
    // - no Jersey and no Jackson: no code uses them.
    implementation 'org.apache.tika:tika-parsers:3.3.3'
    implementation 'org.apache.tika:tika-core:3.3.3'
    implementation 'org.apache.tika:tika-parser-pdf-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-microsoft-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-miscoffice-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-ocr-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-text-module:3.3.3'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.1'
    implementation 'org.apache.poi:poi-ooxml:5.5.1'
    implementation 'org.apache.xmlbeans:xmlbeans:5.1.1'
    implementation 'xerces:xercesImpl:2.12.2'
    implementation 'org.odftoolkit:odfdom-java:0.11.0'
    implementation 'org.freemarker:freemarker:2.3.34'
    implementation 'net.sourceforge.htmlcleaner:htmlcleaner:2.29'
    implementation 'net.sf.cssbox:webvector:3.5'
    implementation 'net.arnx:wmf2svg:0.9.0'
    implementation 'jaxen:jaxen:2.0.0'
    implementation 'org.xerial:sqlite-jdbc:3.49.1.0'
    implementation 'org.jsoup:jsoup:1.20.1'
    implementation 'com.dslplatform:dsl-json:2.0.1'
    implementation 'commons-codec:commons-codec:1.15'
    implementation 'cat.inspiracio:rhino-js-engine:1.7.7.1'
    implementation 'com.sun.xml.bind:jaxb-core:2.3.0'
    implementation 'javax.xml.bind:jaxb-api:2.3.1'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.eclipse.jetty.websocket:websocket-api:9.4.58.v20250814'
    implementation 'org.eclipse.jetty.websocket:websocket-server:9.4.58.v20250814'
    implementation 'org.eclipse.jetty:jetty-server:9.4.58.v20250814'
    implementation 'org.eclipse.jetty:jetty-servlet:9.4.58.v20250814'
    implementation 'org.eclipse.jetty:jetty-xml:9.4.58.v20250814'

    // VS Code bridge.
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

jar {
    archiveFileName = 'requality-server.jar'
    manifest { attributes('Main-Class': 'com.unitesk.requality.vscode.Main') }
}

test {
    useJUnitPlatform()
    // The Requality core keeps global state: one JVM per test class.
    forkEvery = 1
    maxHeapSize = '2g'
    testLogging { events 'failed'; exceptionFormat 'full' }
    systemProperty 'requality.traceLoading', System.getProperty('requality.traceLoading', 'false')
    // WindowsRegistryTest: a real reg program (e.g. the reg.exe of Wine) and the value of LongPathsEnabled it reads
    systemProperty 'requality.test.reg', System.getProperty('requality.test.reg', '')
    systemProperty 'requality.test.reg.longPaths', System.getProperty('requality.test.reg.longPaths', '0')
    systemProperty 'requality.resources', layout.buildDirectory.dir('dist/resources').get().asFile.absolutePath
    // the catalog locks of the test servers (CatalogLocks), not in the home folder
    systemProperty 'requality.locks', layout.buildDirectory.dir('catalog-locks').get().asFile.absolutePath
    // a test that finds a catalog of another process waits 3 s for it, not the 45 s of a server
    systemProperty 'requality.lockWait', '3000'
    // as Main: AWT is headless except on Windows (the Swing bridge works headless; the server has no AWT windows)
    if (!System.getProperty('os.name').toLowerCase().startsWith('windows'))
        systemProperty 'java.awt.headless', 'true'
    dependsOn 'assembleResources'
}

def distDir = file('../dist/server')

// Web editor resources exactly as the upstream build lays them out: jstools with CKEditor 4.16 extracted over it.
tasks.register('assembleResources', Sync) {
    into layout.buildDirectory.dir('dist/resources')
    from('upstream') {
        include 'jstools/**', 'templates/**', 'templatesStore/**', 'icons/**', 'docs/**'
    }
    // the plug-in's "resources" folder (Bundle.getEntry("resources/regfix/...") of the Windows registry fixes)
    from('upstream/resources') { into 'resources' }
    from(zipTree('upstream/ckeditor-4.16.zip')) {
        into 'jstools'
    }
    // Extension registry of the plug-in (ExtensionRegistry) and images of the Eclipse workbench (ISharedImages).
    from('upstream/eclipse-reference') { include 'plugin.xml' }
    from('src/main/web/shared-images') { into 'icons/shared' }
    // Overlays of the differences in compare viewers (org.eclipse.compare icons/full/ovr16, EPL-2.0).
    from('src/main/web/compare-images') { into 'icons/compare' }
    from('src/main/web/ide-images') { into 'icons/ide' }
    // icons of the Eclipse platform bundles at their plug-in paths (icons/full/...), as platform-plugin.xml names them
    from('src/main/web/full-images') { into 'icons/full' }
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
    inputs.file('src/main/web/vscode-bridge.js')
    doLast {
        // Every page served by the resources server loads varStorage.js; the VS Code bridge is appended to it.
        def target = new File(destinationDir, 'jstools/varStorage.js')
        if (!target.getText('UTF-8').contains('requality-vscode bridge'))
            target.append(file('src/main/web/vscode-bridge.js').getText('UTF-8'), 'UTF-8')
    }
}

tasks.register('dist', Sync) {
    dependsOn jar, assembleResources
    into distDir
    from(configurations.runtimeClasspath) { into 'lib' }
    from(jar.archiveFile) { into 'lib' }
    from(layout.buildDirectory.dir('dist/resources')) { into 'resources' }
    // The bundled Requality core and web editors are Apache-2.0 (see upstream/PROVENANCE.md).
    from('upstream/LICENSE.txt') { rename { 'LICENSE-requality-upstream.txt' } }
    from('upstream/PROVENANCE.md')
    // bin/requality-mcp(.cmd): the headless server with the MCP server for AI agents
    from('src/main/dist') {
        filesMatching('bin/requality-mcp') { permissions { unix('rwxr-xr-x') } }
    }
}

tasks.register('printClasspath') {
    doLast { println((sourceSets.main.runtimeClasspath).asPath) }
}
