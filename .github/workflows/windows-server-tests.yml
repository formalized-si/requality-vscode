name: Windows server tests
# The server tests on Windows, started by hand: all of them, or the test classes in the input tests, in one or more
# parallel runs (to find a test that fails only now and then). The reports of the tests (with the log of the server) are
# kept as artifacts.
on:
  workflow_dispatch:
    inputs:
      tests:
        description: Gradle test patterns, separated by spaces (empty = all tests)
        default: ''
      runs:
        description: The parallel runs, as a JSON array (for example [1,2,3,4])
        default: '[1]'
jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        run: ${{ fromJSON(inputs.runs || '[1]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Server tests
        shell: bash
        env:
          TESTS: ${{ inputs.tests }}
        run: |
          cd server
          args=()
          for t in $TESTS; do args+=(--tests "$t"); done
          ./gradlew test --console=plain "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-test-results-${{ matrix.run }}
          path: server/build/test-results/test/*.xml
